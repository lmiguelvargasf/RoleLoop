[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "roleloop"
version = "0.1.0"
description = "A local, evidence-first job search workflow for the terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2,<3",
  "platformdirs>=4.11,<5",
  "pydantic>=2.10,<3",
  "pypdf>=6.14,<7",
  "textual>=8.2,<9",
]

[project.scripts]
roleloop = "roleloop.adapters.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "pytest-timeout>=2.4,<3",
  "resvg-py>=0.4,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/roleloop"]

[tool.hatch.build]
include = [
  "docs/**/*.md",
  "src/roleloop/**/*.py",
  "src/roleloop/**/*.sql",
  "src/roleloop/**/*.tcss",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 15
markers = [
  "live_openai: opt-in smoke that makes exactly one Scout, Reviewer, and Resume request",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/fixtures/master_resume_contract/roleloop_contract"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# This fixture is copied byte-for-byte from the coordinated master-resume
# contract so the drift test can prove both repositories execute the same bridge.
"tests/fixtures/master_resume_contract/roleloop_contract/v1/core.py" = ["B905"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["roleloop"]
mypy_path = "src"
